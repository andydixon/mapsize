[package]
name = "mapsize"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Interactive terminal disk usage analyser (Rust port)"

[dependencies]
libc = "0.2"
crossbeam-channel = "0.5"
crossterm = "0.28"
flate2 = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
