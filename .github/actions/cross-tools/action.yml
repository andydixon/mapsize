name: cross-tools
description: Rust targets, zig, cargo-zigbuild and cross for scripts/build.sh
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl i686-unknown-linux-musl \
          armv7-unknown-linux-musleabihf riscv64gc-unknown-linux-musl x86_64-pc-windows-gnu \
          aarch64-pc-windows-gnullvm x86_64-unknown-freebsd x86_64-unknown-netbsd
        curl -sSLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
        mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1 && rm zig.tar.xz
        echo "$HOME/zig" >>"$GITHUB_PATH"
        cargo install cargo-zigbuild --version 0.23.4 --locked
        cargo install cross --version 0.2.5 --locked
